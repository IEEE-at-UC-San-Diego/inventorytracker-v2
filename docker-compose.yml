# Dokploy "Compose" deployment: app + self-hosted Convex.
# Add domains in Dokploy for app:3000, backend:3210 (API), backend:3211 (HTTP
# actions), and dashboard:6791. See .env.docker.example for the variables.

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    expose:
      - 3210
      - 3211
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_NAME=${CONVEX_INSTANCE_NAME:-inventory-tracker}
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET}
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:?set CONVEX_CLOUD_ORIGIN}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:?set CONVEX_SITE_ORIGIN}
      - DATABASE_URL=${CONVEX_DATABASE_URL:-}
      - DISABLE_BEACON=${CONVEX_DISABLE_BEACON:-true}
      - REDACT_LOGS_TO_CLIENT=true
      - DO_NOT_REQUIRE_SSL=${CONVEX_DO_NOT_REQUIRE_SSL:-}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    expose:
      - 6791
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN}
    depends_on:
      backend:
        condition: service_healthy

  convex-deploy:
    build:
      context: .
      target: convex-deploy
    restart: 'no'
    environment:
      - CONVEX_SELF_HOSTED_URL=http://backend:3210
      - CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      - LOGTO_ENDPOINT=${LOGTO_ENDPOINT:?set LOGTO_ENDPOINT}
      - LOGTO_APP_ID=${LOGTO_APP_ID:?set LOGTO_APP_ID}
    depends_on:
      backend:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
      args:
        - VITE_CONVEX_URL=${CONVEX_CLOUD_ORIGIN}
        - VITE_LOGTO_ENDPOINT=${LOGTO_ENDPOINT}
        - VITE_LOGTO_APP_ID=${LOGTO_APP_ID}
    restart: unless-stopped
    expose:
      - 3000
    depends_on:
      convex-deploy:
        condition: service_completed_successfully

volumes:
  convex-data:
