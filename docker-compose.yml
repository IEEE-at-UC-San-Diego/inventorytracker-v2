# Dokploy "Compose" deployment for the app. Convex runs separately (your own
# self-hosted instance); `convex-deploy` pushes convex/ to it before the app
# starts. Add a Dokploy domain for app:3000. See .env.docker.example.

services:
  convex-deploy:
    build:
      context: .
      target: convex-deploy
    restart: 'no'
    environment:
      - CONVEX_SELF_HOSTED_URL=${CONVEX_SELF_HOSTED_URL:-${CONVEX_URL}}
      - CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      - LOGTO_ENDPOINT=${LOGTO_ENDPOINT:?set LOGTO_ENDPOINT}
      - LOGTO_APP_ID=${LOGTO_APP_ID:?set LOGTO_APP_ID}

  app:
    build:
      context: .
      target: app
      args:
        - VITE_CONVEX_URL=${CONVEX_URL:?set CONVEX_URL}
        - VITE_LOGTO_ENDPOINT=${LOGTO_ENDPOINT}
        - VITE_LOGTO_APP_ID=${LOGTO_APP_ID}
    restart: unless-stopped
    expose:
      - 3000
    depends_on:
      convex-deploy:
        condition: service_completed_successfully
